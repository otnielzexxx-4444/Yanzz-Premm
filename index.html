<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yanzz Premm</title>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#0b0b0b;
color:white;
overflow-x:hidden;
}

header{
position:fixed;
top:0;
width:100%;
padding:20px 8%;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(0,0,0,.8);
backdrop-filter:blur(10px);
z-index:1000;
}

.logo{
font-size:24px;
font-weight:700;
color:#ff2e63;
}

nav a{
text-decoration:none;
color:white;
margin-left:25px;
transition:.3s;
}

nav a:hover{
color:#ff2e63;
}

.hero{
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
background:
linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.8)),
url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=1600');
background-size:cover;
background-position:center;
}

.hero h1{
font-size:60px;
margin-bottom:15px;
}

.hero span{
color:#ff2e63;
}

.hero p{
max-width:700px;
color:#d0d0d0;
margin-bottom:30px;
}

.btn{
display:inline-block;
padding:15px 35px;
background:#ff2e63;
border-radius:50px;
color:white;
text-decoration:none;
font-weight:600;
transition:.3s;
}

.btn:hover{
transform:scale(1.05);
}

.section{
padding:90px 8%;
}

.section-title{
text-align:center;
font-size:35px;
margin-bottom:40px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:25px;
}

.card{
background:#171717;
border:1px solid #2d2d2d;
border-radius:20px;
padding:25px;
text-align:center;
transition:.3s;
}

.card:hover{
transform:translateY(-8px);
border-color:#ff2e63;
}

.card h3{
margin-bottom:10px;
}

.price{
font-size:28px;
font-weight:700;
color:#ff2e63;
margin:15px 0;
}

.features{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}
